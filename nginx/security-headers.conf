# =============================================================================
# nginx reverse-proxy config: HTTP security headers for the Streamlit app.
#
# WHY THIS FILE EXISTS:
# Streamlit's built-in server does not let application code set arbitrary
# HTTP response headers (no CSP, HSTS, X-Frame-Options, etc. from Python).
# The correct, standard way to add these for a Streamlit deployment is a
# reverse proxy in front of it -- nginx here, but the same headers apply
# if you use Caddy, Traefik, an ALB, or Cloudflare instead.
#
# Deploy this in front of `streamlit run app.py --server.port=8501`.
# =============================================================================

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    # --- TLS (fill in your real certs; this is HSTS's prerequisite) --------
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Security headers ----------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'self';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Explicitly restrict which origins may talk to the app (mirrors the
    # server_name above -- update if you serve multiple domains).
    add_header Access-Control-Allow-Origin "https://your-domain.example.com" always;

    # Streamlit uses a websocket connection for reruns; must be proxied
    # with Upgrade/Connection headers or the app will not function.
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name your-domain.example.com;
    # Redirect all plain HTTP to HTTPS -- HSTS above only takes effect once
    # the browser has seen at least one HTTPS response, so this redirect is
    # required, not optional.
    return 301 https://$host$request_uri;
}

# =============================================================================
# Secure cookies / SameSite:
# Streamlit's own session cookie is issued over the connection above; once
# TLS is terminated here and the app is only ever reached over HTTPS (via
# the redirect above), browsers will treat cookies set with `Secure` as
# required, and Streamlit's XSRF cookie already sets SameSite=Strict by
# default. If you add any additional cookies at the proxy layer (e.g. for
# SSO), always set: Secure; HttpOnly; SameSite=Strict.
# =============================================================================
